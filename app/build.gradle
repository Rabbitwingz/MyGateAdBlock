plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.gateadskipper'
    compileSdk 34

    defaultConfig {
        applicationId 'com.local.gateadskipper'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the APK can be sideloaded without setting up a keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
